/**:
  ros__parameters:
    sensors:
      type: diagnostic_aggregator/AnalyzerGroup
      path: Sensors
      analyzers:
        bumper:
          type: diagnostic_aggregator/GenericAnalyzer
          path: Bumper
          startswith: ['hsrb_bumper']
        urg:
          type: diagnostic_aggregator/GenericAnalyzer
          path: Hokuyo
          find_and_remove_prefix: ['urg_node: ']
        imu:
          type: diagnostic_aggregator/GenericAnalyzer
          path: IMU
          find_and_remove_prefix: ['imu_diag_updater: ']
    joints:
      type: diagnostic_aggregator/GenericAnalyzer
      path: Joints
      regex: ['.*_joint']
      num_items: 11
    joy:
      type: diagnostic_aggregator/DiscardAnalyzer
      path: Joy
      startswith: ['joy_node:']
    controller_manager_hw_activity:
      type: diagnostic_aggregator/DiscardAnalyzer
      path: ControllerManagerHW
      contains: ['controller_manager: Hardware Components Activity']