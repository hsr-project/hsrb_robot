controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    head_trajectory_controller:
      type: tmc_joint_command_controller/BasicJointCommandController
    arm_trajectory_controller:
      type: tmc_joint_command_controller/BasicJointCommandController
    gripper_controller:
      type: hsrb_gripper_controller/HrhGripperController
    omni_base_controller:
      type: hsrb_base_controllers/OmniBaseController
    servo_state_controller:
      type: tmc_realtime_controllers/ServoStateBroadcaster
    servo_parameter_reader:
      type: tmc_realtime_controllers/InfrequentReadingController
    servo_parameter_writer:
      type: tmc_realtime_controllers/InfrequentWritingController
    servo_diagnostic_broadcaster:
      type: hsrb_diagnostic_broadcaster/ServoDiagnosticBroadcaster
    tmc_digital_input_controller:
      type: tmc_realtime_controllers/DigitalInputController
    tmc_digital_output_controller:
      type: tmc_realtime_controllers/DigitalOutputController

tmc_digital_input_controller:
  ros__parameters:
    state_interface_name: "pin0/state"
    topic_name: "gpio/input0"
    inverse_mode: false

tmc_digital_output_controller:
  ros__parameters:
    command_interface_name: "pin4/command"
    topic_name: "gpio/output0"
    default_output: false

hsrb_hw:
  ros__parameters:
    rs485_device: /dev/ttyCTI2
    use_usb: false
    network_timeout: 2000000
    network_tick: 10000

head_trajectory_controller:
  ros__parameters:
    joints:
      - head_tilt_joint
      - head_pan_joint
    state_interfaces:
      - position
    constraints:
      stopped_velocity_tolerance: 0.5
      goal_time: 0.05
      head_tilt_joint:
        goal: 0.2
    open_loop_control: true
    use_velocity_state_for_trajectory: false
    position_control_mode: 5
    velocity_control_mode: 3

arm_trajectory_controller:
  ros__parameters:
    joints:
      - arm_lift_joint
      - arm_flex_joint
      - arm_roll_joint
      - wrist_flex_joint
      - wrist_roll_joint
    state_interfaces:
      - position
    constraints:
      stopped_velocity_tolerance: 0.5
      goal_time: 0.05
    open_loop_control: true
    use_velocity_state_for_trajectory: false
    position_control_mode: 5
    velocity_control_mode: 3
    arm_flex_joint:
      position_control_mode: 8
    wrist_roll_joint:
      position_control_mode: 7

gripper_controller:
  ros__parameters:
    joints:
      - hand_motor_joint
    force_calib_data_path: /etc/opt/tmc/robot/conf.d/calib_results/hand_force_params.yaml
    position_goal_tolerance: 0.2
    left_spring_joint: hand_l_spring_proximal_joint
    right_spring_joint: hand_r_spring_proximal_joint
    open_loop_control: true
    do_output_position_control : true
    position_control_current_min : -1.0

omni_base_controller:
  ros__parameters:
    use_base_roll_velocity: true
    joints:
      l_wheel: base_l_drive_wheel_joint
      r_wheel: base_r_drive_wheel_joint
      steer: base_roll_joint
    wheel_odom_map_frame: odom
    wheel_odom_base_frame: base_footprint_wheel
    odometry_publish_rate: 50.0
    transform_publish_rate: 50.0
    yaw_velocity_limit: 1.8
    wheel_velocity_limit: 8.5
    base_coordinates: [odom_x, odom_y, odom_t]
    odom_x: {p_gain: 1.0}
    odom_y: {p_gain: 1.0}
    odom_t: {p_gain: 1.0}
    constraints:
      stopped_velocity_tolerance: 0.0
      odom_x: {trajectory: 0.05}
      odom_y: {trajectory: 0.05}
      odom_t: {trajectory: 0.1}
    open_loop_control: true

servo_parameter_writer:
  ros__parameters:
    denied_keys:
      - const_id
      - command_write_nvm
    attribute: writer
    joints:
      - arm_lift_joint
      - arm_flex_joint
      - arm_roll_joint
      - wrist_flex_joint
      - wrist_roll_joint
      - head_tilt_joint
      - head_pan_joint
      - hand_motor_joint

servo_parameter_reader:
  ros__parameters:
    joints:
      - arm_lift_joint
      - arm_flex_joint
      - arm_roll_joint
      - wrist_flex_joint
      - wrist_roll_joint
      - head_tilt_joint
      - head_pan_joint
      - hand_motor_joint
    attribute: reader

servo_state_controller:
  ros__parameters:
    joints:
      - arm_lift_joint
      - arm_flex_joint
      - arm_roll_joint
      - wrist_flex_joint
      - wrist_roll_joint
      - head_tilt_joint
      - head_pan_joint
      - hand_motor_joint
      - base_l_drive_wheel_joint
      - base_r_drive_wheel_joint
      - base_roll_joint
    publish_rate : 30.0
